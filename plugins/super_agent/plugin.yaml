name: super_agent
version: 0.1.0
description: Opt-in Router whose isolated Worker sessions are read-only to users.
kind: standalone
settings_page:
  location: root
  title: Super Agent
  icon: hubot
  order: 85
provides_locales: [en, zh]
provides_tools: [super_agent_route]
provides_hooks:
  - pre_bot_chat
  - post_gateway_admission
  - pre_tool_call
config_schema:
  message_sources:
    type: list
    default:
      - "*"
    label: Read message sources
    description: Platform IDs allowed to hand off tasks. Use local for Desktop chats including Bot Chat, ["*"] for all, or [] for none.
  write_message_sources:
    type: list
    default: ["same-as-read"]
    label: Write message sources
    description: Read/write sources receive each Worker turn's report in their originating chat. Write-only sources receive reports in their Home Channel. Background delivery requires allow_gateway_injection. Use [] for none or ["same-as-read"] to follow read permissions.
  worker_provider:
    type: string
    default: ""
    label: Worker provider
    description: Provider for new Worker Sessions. Leave blank to use the profile default.
  worker_model:
    type: string
    model_provider_key: worker_provider
    default: ""
    label: Worker model
    description: Model for new Worker Sessions. Leave blank to use the profile default.
  max_concurrent_workers:
    type: string
    choices: ["1", "2", "3", "4", "5", "6", "7", "8"]
    default: "2"
    label: Maximum concurrent Workers
    description: Router-wide concurrent Worker limit. Each Ticket currently owns one Worker.
  workspace_root:
    type: string
    required: true
    label: Workspace root
    description: Absolute Git repository root used to create per-Assignment worktrees.
  default_sandbox:
    type: string
    choices: [read-only, workspace-write, workspace-exec]
    default: workspace-write
    label: Default sandbox
    description: read-only, workspace-write, or workspace-exec.
  watchdog_seconds:
    type: number
    default: 1800
    label: Watchdog threshold
    description: Seconds without a persisted Assignment or Turn state change before an alert.
  turn_timeout_seconds:
    type: number
    default: 0
    label: Hard time limit per turn (seconds)
    description: Zero disables the limit. All Workers in this profile use this limit when starting a turn.
  history_retention_days:
    type: number
    default: 0
    label: Keep settled ticket history (days)
    description: Zero keeps all history. Positive whole days expire closed tickets with settled deliveries. Git worktrees are retained.
